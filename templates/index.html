<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ app_name }}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 8.5C4 6 6 4 8.5 4h5.6c1 0 1.9.4 2.6 1.1l2.2 2.2c.7.7 1.1 1.6 1.1 2.6v7.6c0 1.4-1.1 2.5-2.5 2.5h-9c-2.5 0-4.5-2-4.5-4.5v-7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8.5 13h7M8.5 16.5h4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      <span id="brandName">{{ app_name }}</span>
    </div>
    <div class="searchwrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/><path d="M20 20l-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <input class="search" id="searchInput" type="search" placeholder="Поиск по названию и содержимому документов…" aria-label="Поиск документов" autocomplete="off">
      <span class="kbd">Ctrl+K</span>
      <div class="search-results" id="searchResults" hidden></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" id="settingsBtn" type="button" title="Настройки" aria-label="Настройки">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="body-row">
    <aside class="sidebar">
      <nav class="folder-list" id="folderList"></nav>
      <div class="storage-note">
        <div class="storage-bar"><div class="storage-fill" id="stFill" style="width:0%"></div></div>
        <div class="storage-text" id="stText"></div>
        <div class="storage-path" id="stPath"></div>
      </div>
    </aside>
    <main class="content" id="content">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div class="page-head">
        <h1 class="page-title" id="pageTitle"></h1>
        <div class="toolbar-actions">
          <label class="switch" title="Загруженные файлы раскладываются по папкам по содержанию текста, а не по названию">
            <input type="checkbox" id="autoSort"> Автосортировка по содержанию
          </label>
          <button class="btn btn-ghost" id="sortInboxBtn" hidden>Распределить входящие</button>
          <button class="btn btn-ghost" id="reparseAllBtn" title="Распознать заново все файлы в этой папке и во вложенных">Перераспознать</button>
          <button class="btn btn-ghost" id="newFolderBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3.5 7.2c0-1.5 1.2-2.7 2.7-2.7h3.6c.6 0 1.1.2 1.5.6l1.2 1.1h5.3c1.5 0 2.7 1.2 2.7 2.7v7.4c0 1.5-1.2 2.7-2.7 2.7H6.2c-1.5 0-2.7-1.2-2.7-2.7V7.2z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M12 11v4.5M9.7 13.2h4.6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
            Новая папка
          </button>
          <button class="btn btn-primary" id="uploadBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M12 4v11M12 4l-4.5 4.5M12 4l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v1.5A2.5 2.5 0 0 0 6.5 21h11a2.5 2.5 0 0 0 2.5-2.5V17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            Загрузить
          </button>
          <input type="file" id="fileInput" accept="application/pdf,.pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document,.docx" multiple hidden>
        </div>
      </div>
      <div class="toolbar-info" id="toolbarInfo"></div>
      <div class="file-table" id="fileTable">
        <div class="file-row file-row--head">
          <div class="col-name">Название</div><div class="col-type">Статус</div>
          <div class="col-size">Размер</div><div class="col-date">Изменён</div><div class="col-actions" style="opacity:1"></div>
        </div>
        <div id="fileRows"></div>
      </div>
      <div class="dropzone-hint" id="dropHint" hidden>Отпустите, чтобы загрузить PDF</div>
    </main>
  </div>
</div>

<div id="viewerHost"></div>
<div id="dialogHost"></div>
<div class="toast" id="toast" hidden></div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
